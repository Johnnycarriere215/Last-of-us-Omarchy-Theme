text-color=#cec9bd
border-color=#c9803a
background-color=#12140e
width=420
height=110
padding=10
border-size=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32
on-notify=exec [ -f ~/.config/tlou/notify-sound.sh ] && ~/.config/tlou/notify-sound.sh

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
